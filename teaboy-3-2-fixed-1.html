async function setTeaBoyOnline(name) {
  // Upsert teaboy status
  await fetch(`${SUPABASE_URL}/rest/v1/teaboy_status?name=eq.${encodeURIComponent(name)}`, {
    method:"DELETE",
    headers:{ "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}` }
  }).catch(()=>{});
  await fetch(`${SUPABASE_URL}/rest/v1/teaboy_status`, {
    method:"POST",
    headers:{ "Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Prefer":"return=minimal" },
    body:JSON.stringify({ name, is_online:true })
  }).catch(()=>{});
}

async function setTeaBoyOffline(name) {
  await fetch(`${SUPABASE_URL}/rest/v1/teaboy_status?name=eq.${encodeURIComponent(name)}`, {
    method:"PATCH",
    headers:{ "Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Prefer":"return=minimal" },
    body:JSON.stringify({ is_online:false })
  }).catch(()=>{});
}


async function fetchOrders() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?order=created_at.asc`, {
    headers:{ "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error("Fetch failed");
  return res.json();
}

async function markDone(id) {
  await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`, {
    method:"PATCH",
    headers:{ "Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Prefer":"return=minimal" },
    body:JSON.stringify({ status:"done" })
  }).catch(e=>console.log(e));
}

async function deleteOrder(id) {
  // Fire and forget — don't wait for response
  fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`, {
    method:"DELETE",
    headers:{ "apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}` }
  }).catch(e=>console.log(e));
}

function playPing() {
  try {
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.6);
    osc.start(); osc.stop(ctx.currentTime+0.6);
  } catch {}
}

function timeAgo(ts) {
  const mins = Math.floor((Date.now()-new Date(ts).getTime())/60000);
  if (mins<1) return "Just now";
  if (mins===1) return "1 min ago";
  return `${mins} min ago`;
}

function sugarColor(level) {
  if (!level || level==="N/A") return "#444";
  if (level==="No Sugar") return "#6366f1";
  if (level==="Less Sugar") return "#f59e0b";
  if (level==="Medium") return "#f97316";
  if (level==="Extra Sugar") return "#EB0A1E";
  return "#555";
}

  return (
    <img src={ALSAYER_IMG} style={{ width:size, height:size, borderRadius:8, objectFit:"cover", flexShrink:0 }} alt="Al-Sayer"/>
  );
}

function ToyotaLogo({ size=42 }) {
  return (
    <img src={TOYOTA_IMG} style={{ height:size, width:"auto", objectFit:"contain" }} alt="Toyota"/>
  );
}

// ── ORDER CARD ──
function OrderCard({ order, onDone, onDelete }) {
  const isPending = order.status === "pending";
  const mins = Math.floor((Date.now()-new Date(order.created_at).getTime())/60000);
  const isUrgent = isPending && mins >= 5;
  const isStaff = order.orderer_type === "staff";

  const badgeBg = isStaff
    ? "#1a2a3a"
    : isPending
      ? isUrgent ? "#2a1800" : "#1c0a0a"
      : "#0a160a";

  const badgeColor = isStaff ? "#60a5fa" : isPending ? (isUrgent?"#f59e0b":"#EB0A1E") : "#22c55e";
  const borderColor = isStaff ? "#1e3a5a" : isPending ? (isUrgent?"#7c4a00":"#2a2a2a") : "#1a3a1a";

  return (
    <div className="slide" style={{
      background: isPending ? (isUrgent?"#1c1100":"#1c1c1c") : "#101610",
      borderRadius:16,
      border:`1.5px solid ${borderColor}`,
      padding:"14px",
      display:"flex", alignItems:"stretch", gap:12,
      opacity: isPending?1:0.65,
    }}>
      {/* Left Badge — TABLE or STAFF */}
      <div style={{
        background: badgeBg,
        borderRadius:10, padding:"8px 6px",
        textAlign:"center", width:76, flexShrink:0,
        display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
        border:`1px solid ${badgeColor}22`
      }}>
        {isStaff ? (
          <>
            <div style={{ fontSize:20, marginBottom:2 }}>👤</div>
            <div style={{ color:badgeColor, fontSize:9, fontWeight:700, letterSpacing:0.5, lineHeight:1.3, wordBreak:"break-word", textAlign:"center" }}>
              {order.orderer_name ? order.orderer_name.split(" ")[0] : "Staff"}
            </div>
            <div style={{ color:"#444", fontSize:8, marginTop:2 }}>
              {order.orderer_role ? order.orderer_role.split(" ")[0] : ""}
            </div>
          </>
        ) : (
          <>
            <div style={{ color:"rgba(255,255,255,0.4)", fontSize:7, fontWeight:700, letterSpacing:1, marginBottom:2 }}>SECTION</div>
            <div style={{ color:badgeColor, fontSize:9, fontWeight:900, lineHeight:1.2, textAlign:"center", wordBreak:"break-word" }}>
              {order.section || order.table_num}
            </div>
            <div style={{ width:"100%", height:1, background:"rgba(255,255,255,0.08)", margin:"4px 0" }}/>
            <div style={{ color:"rgba(255,255,255,0.4)", fontSize:7, fontWeight:700, letterSpacing:1, marginBottom:1 }}>TABLE</div>
            <div style={{ color:badgeColor, fontSize:16, fontWeight:900, lineHeight:1 }}>
              {order.table_letter || "-"}
            </div>
            <div style={{ width:"100%", height:1, background:"rgba(255,255,255,0.08)", margin:"4px 0" }}/>
            <div style={{ color:"rgba(255,255,255,0.4)", fontSize:7, fontWeight:700, letterSpacing:1, marginBottom:1 }}>SEAT</div>
            <div style={{ color:badgeColor, fontSize:14, fontWeight:900, lineHeight:1 }}>
              {order.seat || "-"}
            </div>
          </>
        )}
      </div>

      {/* Middle — Drink Info */}
      <div style={{ flex:1, minWidth:0, display:"flex", flexDirection:"column", justifyContent:"center" }}>
        <div style={{ color:"white", fontWeight:800, fontSize:17 }}>{order.emoji} {order.coffee}</div>
        <div className="arabic" style={{ color:"#555", fontSize:12, direction:"rtl", textAlign:"left", marginBottom:6 }}>{order.coffee_ar}</div>

        {/* Sugar Level Badge */}
        {order.sugar_level && order.sugar_level !== "N/A" && (
          <div style={{ display:"inline-flex", alignItems:"center", gap:5, background:"#1a1a1a", borderRadius:20, padding:"3px 10px", marginBottom:5, width:"fit-content", border:`1px solid ${sugarColor(order.sugar_level)}44` }}>
            <span style={{ fontSize:11 }}>🍬</span>
            <span style={{ color:sugarColor(order.sugar_level), fontSize:11, fontWeight:700 }}>{order.sugar_level}</span>
          </div>
        )}

        {/* Staff full name + role */}
        {isStaff && order.orderer_name && (
          <div style={{ color:"#60a5fa", fontSize:11, fontWeight:600 }}>
            👤 {order.orderer_name} · {order.orderer_role}
          </div>
        )}

        <div style={{ color:isUrgent?"#f59e0b":"#444", fontSize:11, marginTop:4, fontWeight:isUrgent?700:400 }}>
          ⏰ {timeAgo(order.created_at)}{isUrgent && "  ⚠️ Waiting too long!"}
        </div>
      </div>

      {/* Right — Action Button */}
      <div style={{ display:"flex", alignItems:"center" }}>
        {isPending ? (
          <button onClick={()=>onDone(order.id)} style={{
            background:"#22c55e", color:"white", border:"none", borderRadius:12,
            width:50, height:50, fontSize:22, fontWeight:900, cursor:"pointer",
            flexShrink:0, boxShadow:"0 4px 16px rgba(34,197,94,0.25)"
          }}>✓</button>
        ) : (
          <button onClick={()=>onDelete(order.id)} style={{
            background:"transparent", border:"1px solid #2a2a2a", color:"#444",
            borderRadius:10, width:40, height:40, fontSize:16, cursor:"pointer", flexShrink:0
          }}>🗑</button>
        )}
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [pin, setPin] = React.useState("");
  const [selectedName, setSelectedName] = React.useState(TEABOYS[0].name);
  const [error, setError] = React.useState("");
  const [loading, setLoading] = React.useState(false);

  const handleLogin = async () => {
    const teaboy = TEABOYS.find(t => t.name === selectedName);
    if (!teaboy || teaboy.pin !== pin) {
      setError("Wrong PIN! Try again.");
      setPin("");
      return;
    }
    setLoading(true);
    await setTeaBoyOnline(selectedName);
    setLoading(false);
    onLogin(selectedName);
  };

  return (
    <div style={{
      minHeight:"100vh", background:"#0f0f0f",
      display:"flex", flexDirection:"column",
      alignItems:"center", justifyContent:"center",
      padding:"24px"
    }}>
      <div style={{ marginBottom:24, textAlign:"center" }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:16, marginBottom:16 }}>
          <ToyotaLogo size={80}/>
        </div>
        <div style={{ color:"white", fontWeight:900, fontSize:22 }}>Tea Boy Login</div>
        <div style={{ color:"#444", fontSize:13, marginTop:4 }}>Select your name and enter PIN</div>
      </div>

      <div style={{
        background:"#1a1a1a", borderRadius:20,
        padding:"28px 24px", width:"100%", maxWidth:360,
        border:"1px solid #2a2a2a"
      }}>
        {/* Name selector */}
        <div style={{ marginBottom:16 }}>
          <div style={{ color:"#888", fontSize:11, fontWeight:700, letterSpacing:1, marginBottom:8, textTransform:"uppercase" }}>Your Name</div>
          {TEABOYS.map(t => (
            <div key={t.name} onClick={() => { setSelectedName(t.name); setError(""); setPin(""); }}
              style={{
                padding:"12px 16px", borderRadius:12, marginBottom:8, cursor:"pointer",
                background: selectedName===t.name ? "#EB0A1E22" : "#111",
                border: selectedName===t.name ? "1.5px solid #EB0A1E" : "1.5px solid #222",
                color: selectedName===t.name ? "white" : "#666",
                fontWeight: selectedName===t.name ? 700 : 400,
                transition:"all 0.2s"
              }}>
              👤 {t.name}
            </div>
          ))}
        </div>

        {/* PIN input */}
        <div style={{ marginBottom:16 }}>
          <div style={{ color:"#888", fontSize:11, fontWeight:700, letterSpacing:1, marginBottom:8, textTransform:"uppercase" }}>PIN Code</div>
          <input
            type="password" inputMode="numeric" maxLength={4}
            value={pin} onChange={e=>{ setPin(e.target.value); setError(""); }}
            placeholder="Enter 4-digit PIN"
            style={{
              width:"100%", background:"#111", border:"1.5px solid #333",
              borderRadius:12, padding:"14px 16px", color:"white",
              fontSize:20, letterSpacing:8, outline:"none",
              textAlign:"center"
            }}
          />
        </div>

        {error && (
          <div style={{ color:"#EB0A1E", fontSize:13, fontWeight:700, textAlign:"center", marginBottom:12 }}>
            ⚠️ {error}
          </div>
        )}

        <button onClick={handleLogin} disabled={loading || pin.length < 4}
          style={{
            width:"100%", padding:"14px", borderRadius:12, border:"none",
            background: pin.length===4 ? "#EB0A1E" : "#222",
            color: pin.length===4 ? "white" : "#444",
            fontSize:15, fontWeight:800, cursor: pin.length===4 ? "pointer" : "not-allowed",
            transition:"all 0.2s"
          }}>
          {loading ? "Logging in..." : "🟢 Go Online"}
        </button>
      </div>
    </div>
  );
}


// ── APP ──
function App() {
  const [orders,    setOrders]    = React.useState([]);
  const [teaBoyName, setTeaBoyName] = React.useState(null);
  const [tab,       setTab]       = React.useState("pending");
  const [connError, setConnError] = React.useState(false);
  const [errorMsg,  setErrorMsg]  = React.useState("");
  const prevCount = React.useRef(0);

  const load = async () => {
    try {
      const data = await fetchOrders();
      if (!Array.isArray(data)) { setConnError(true); setErrorMsg(JSON.stringify(data)); return; }
      const p = data.filter(o=>o.status==="pending").length;
      if (p > prevCount.current && prevCount.current >= 0) playPing();
      prevCount.current = p;
      setOrders(data);
      setConnError(false); setErrorMsg("");
    } catch(e) { setConnError(true); setErrorMsg(e.message); }
  };

  React.useEffect(() => { load(); const t=setInterval(load,4000); return ()=>clearInterval(t); }, []);

  const handleDone = async(id) => {
    setOrders(prev=>prev.map(o=>o.id===id?{...o,status:"done"}:o));
    await markDone(id);
    await load();
  };

  const handleDelete = async(id) => {
    setOrders(prev=>prev.filter(o=>o.id!==id));
    await deleteOrder(id);
  };

  const clearAllDone = async() => {
    const doneList = orders.filter(o=>o.status==="done");
    setOrders(prev=>prev.filter(o=>o.status!=="done"));
    await Promise.all(doneList.map(o=>deleteOrder(o.id)));
  };

  const handleLogout = async () => {
    if(teaBoyName) await setTeaBoyOffline(teaBoyName);
    setTeaBoyName(null);
    setOrders([]);
  };

  const pending = orders.filter(o=>o.status==="pending");
  const done    = orders.filter(o=>o.status==="done");
  const shown   = tab==="pending" ? pending : done;

  const pendingCustomer = pending.filter(o=>o.orderer_type!=="staff").length;
  const pendingStaff    = pending.filter(o=>o.orderer_type==="staff").length;

  if (!teaBoyName) return <LoginScreen onLogin={(name) => setTeaBoyName(name)} />;

  return (
    <div style={{ minHeight:"100vh", background:"#0f0f0f", display:"flex", flexDirection:"column" }}>

      {/* HEADER */}
      <div style={{background:"#0a0a0a",borderBottom:"1px solid #1a1a1a",padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,boxShadow:"0 2px 12px rgba(0,0,0,0.6)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{display:"flex",alignItems:"center",gap:0,border:"1px solid #222",borderRadius:8,overflow:"visible"}}>

            </div>
          </div>
          <div>
            <div style={{color:"white",fontWeight:800,fontSize:15}}>Tea Boy Dashboard</div>
            <div style={{color:"#444",fontSize:10}}>Live · updates every 4s</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{display:"flex",alignItems:"center",gap:6,background:connError?"#1e1000":"#0a1e0a",border:`1px solid ${connError?"#5a3000":"#1a3a1a"}`,borderRadius:20,padding:"5px 12px"}}>
            <div style={{width:8,height:8,background:connError?"#f59e0b":"#22c55e",borderRadius:"50%",animation:"pulse 1.5s infinite"}}/>
            <span style={{color:connError?"#f59e0b":"#22c55e",fontSize:12,fontWeight:700}}>{connError?"Error":"LIVE"}</span>
          </div>
          <button onClick={handleLogout} style={{
            background:"#1a1a1a",border:"1px solid #333",color:"#888",
            borderRadius:20,padding:"5px 12px",fontSize:12,fontWeight:700,
            cursor:"pointer",display:"flex",alignItems:"center",gap:4
          }}>
            🔴 Logout
          </button>
        </div>
      </div>

      {/* ERROR */}
      {connError && errorMsg && (
        <div style={{ background:"#1e0a0a",border:"1px solid #5a1a1a",margin:"10px 14px",borderRadius:10,padding:"10px 14px",color:"#f59e0b",fontSize:12 }}>
          ⚠️ {errorMsg}
        </div>
      )}

      {/* STATS */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", background:"#141414", borderBottom:"1px solid #222", flexShrink:0 }}>
        {[
          { label:"Pending",  val:pending.length,       color:"#EB0A1E", bg:"#1a0a0a" },
          { label:"Customer", val:pendingCustomer,       color:"#f97316", bg:"#1a1000" },
          { label:"Staff",    val:pendingStaff,          color:"#60a5fa", bg:"#0a1020" },
          { label:"Done",     val:done.length,           color:"#22c55e", bg:"#0a160a" },
        ].map((s,i)=>(
          <div key={i} style={{ background:s.bg,padding:"12px 0",textAlign:"center",borderRight:i<3?"1px solid #222":"none" }}>
            <div style={{ color:s.color,fontWeight:900,fontSize:24,lineHeight:1 }}>{s.val}</div>
            <div style={{ color:"#555",fontSize:10,marginTop:3 }}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* TABS */}
      <div style={{ display:"flex", background:"#141414", borderBottom:"1px solid #222", flexShrink:0 }}>
        {[
          { key:"pending", label:"🔴 Pending", count:pending.length, color:"#EB0A1E" },
          { key:"done",    label:"✅ Done",    count:done.length,    color:"#22c55e" },
        ].map(t=>(
          <button key={t.key} onClick={()=>setTab(t.key)} style={{
            flex:1, background:"transparent", border:"none",
            borderBottom:`3px solid ${tab===t.key?t.color:"transparent"}`,
            color:tab===t.key?"white":"#444",
            padding:"13px 0", fontWeight:700, fontSize:15, cursor:"pointer",
          }}>
            {t.label}
            {t.count>0 && <span style={{ background:t.color,color:"white",borderRadius:20,padding:"2px 8px",fontSize:12,fontWeight:900,marginLeft:6 }}>{t.count}</span>}
          </button>
        ))}
      </div>

      {/* LIST */}
      <div style={{ flex:1, overflowY:"auto", padding:"12px 12px 40px" }}>
        {tab==="done" && done.length>0 && (
          <button onClick={clearAllDone} style={{ width:"100%",background:"#1a1a1a",border:"1px solid #2a2a2a",color:"#555",borderRadius:10,padding:"10px",fontSize:13,fontWeight:600,cursor:"pointer",marginBottom:12 }}>
            🗑 Clear All Done
          </button>
        )}
        {shown.length===0 && (
          <div style={{ textAlign:"center",padding:"60px 20px",color:"#444" }}>
            <div style={{ fontSize:52 }}>{tab==="pending"?"✅":"📋"}</div>
            <p style={{ marginTop:12,fontSize:14 }}>{tab==="pending"?"No pending orders":"No completed orders yet"}</p>
          </div>
        )}
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          {shown.map(order=>(
            <OrderCard key={order.id} order={order} onDone={handleDone} onDelete={handleDelete}/>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
